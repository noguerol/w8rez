<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2b52"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#f2561b"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="420" height="300" fill="url(#sky)"/>
  <circle cx="300" cy="100" r="60" fill="url(#sun)"/>

  <polygon points="0,300 140,150 280,300" fill="#1a2133"/>
  <polygon points="140,300 290,110 420,300" fill="#141b2b"/>

  <rect x="0" y="285" width="420" height="15" fill="url(#band)"/>

  <text x="210" y="255" text-anchor="middle"
        font-family="monospace" font-size="22" font-weight="bold" fill="#e6edf3"
        letter-spacing="4">w8rez demo</text>
</svg>
